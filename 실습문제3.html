<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>색 테이블 만들기</title>
    <style>
        #darkorange{
            background-color: darkorange;
            width: 50px;
            height: 50px;
        }
        #olivedrab{
            background-color: olivedrab;
            width: 50px;
            height: 50px;
        }
        #Brown{
            background-color: Brown;
            width: 50px;
            height: 50px;
        }
        #DeepSkyBlue{
            background-color: DeepSkyBlue;
            width: 50px;
            height: 50px;
        }
        #blueViolet{
            background-color: blueViolet;
            width: 50px;
            height: 50px;
        }
        #Gold{
            background-color: Gold;
            width: 50px;
            height: 50px;
        }
    </style>
</head>
    </body>
    <h2>색 이름과 코드</h2>
    <hr>
    <table border="1">
        <tr>
            <thead>
            <th>이름</th><th>코드</th><th>색</th><th>이름</th><th>코드</th><th>색</th>
            </thead>
            <tfoot>
                <td>DarOrange</td><td>#FF8C00</td><td><div id="darkorange"></div></td>
                <td>OliveDrab</td><td>#6B8E23</td><td><div id="olivedrab"></div></td>
            </tfoot>
            <tbody>
                <td>Brown</td><td>#A52A2A</td><td><div id="Brown"></div></td>
                <td>DeepSkyBlue</td><td>#00BFFF</td><td><div id="DeepSkyBlue"></div></td>
                </tbody>
                <tbody>
                <td>BlueViolet</td><td>#8A2BE2</td><td><div id="blueViolet"></div></td>
                <td>Gold</td><td>#FFD700</td><td><div id="Gold"></div></td>
            </tbody>
        </tr>
    </table>
</body>
</html>
