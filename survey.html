<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>설문조사</title>

    <style>
        body{
            margin: 0;
            background-color: #eeeeee;
            font-size: 1em;
            text-indent: 1em;
        }

        header{
            background-color: #e9edf2;
            padding: 40px 20px 20px 20px;
        }

        h1{
            text-align: center;
            color: brown;
            font-size: 55px;
            margin: 0;
            text-indent: 0;
        }

        header p{
            font-family: "휴먼편지체";
            font-size: 20px;
            margin-top: 40px;
        }

        section{
            background-color: #FFB3D0;
            margin: 10px;
            padding: 20px;
        }

        article{
            margin-bottom: 30px;
            font-size: 22px;
        }

        hr{
             
             border-top: 0.2px solid black;
             border-bottom: 1px solid black;
              height: 0;  
        }

        input[type="radio"],
        input[type="checkbox"]{
            font-family: "휴먼편지체";
            transform: scale(1.2);
            margin-left: 10px;
            margin-right: 5px;
            accent-color: blue;
        }

        select{
            width: 250px;
            height: 35px;
            font-size: 18px;
        }
        p{
            font-family: "휴먼편지체";
        }

        textarea{
            margin-left: 20px;
            font-size: 18px;
            resize: none;
        }

        footer{
            font-family: "휴먼편지체";
            background-color: orange;
            font-size: 25px;
            font-style: italic;
            padding: 10px 15px;
            border-radius: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>설문지</h1>

        <p>
            소프트웨어 기술에 대한 의견을 듣습니다.
            많은 참여 부탁드립니다.
        </p>
        <hr>
        <line></line>

    </header>

    <section>

        <article>
            <form>
                <p>학년

                <input type="radio" name="grade" value="1" checked>
                <label>1학년</label>

                <input type="radio" name="grade" value="2">
                <label>2학년</label>

                <input type="radio" name="grade" value="3">
                <label>3학년</label>
                </p>
            </form>
        </article>

        <article>
            <form>
                <p>성별

                <input type="radio" name="gender" value="1">
                <label>남</label>

                <input type="radio" name="gender" value="2">
                <label>여</label>
                </p>
            </form>
        </article>

        <article>
            <form>
                <p>관심 분야

                <select name="interests">
                    <option>모바일 소프트웨어</option>
                    <option>컴퓨터 소프트웨어</option>
                    <option>기타 분야</option>
                </select>
                </p>
            </form>
        </article>

        <article>
            <form>
              <p>진로
                <input type="checkbox" checked>개발
                <input type="checkbox">기획
                <input type="checkbox">영업
                <input type="checkbox">창업
                </p>
            </form>
        </article>

        <article>
            <p>남기고 싶은 말

            <textarea rows="13" cols="55" placeholder="글을 남겨주세요"></textarea>
       </p>
        </article>

    </section>

    <footer>
        Copyright 2026 by MYONGJI COLLEGE
    </footer>

</body>
</html>
